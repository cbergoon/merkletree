name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version (the go directive in go.mod) through current.
        go: ['1.21', '1.22', '1.23', '1.24', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # No third-party dependencies, so there is no go.sum to key a cache on.
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

  lint:
    name: gofmt + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt -s clean:"
            echo "$unformatted"
            gofmt -s -d .
            exit 1
          fi
      - run: go vet ./...
